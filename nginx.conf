events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    types {
        application/javascript  mjs;
    }
    default_type  application/octet-stream;

    client_max_body_size 500M;

    # ==================== 全链路追踪日志格式 ====================
log_format trace_log escape=json
    'local_time:"$time_iso8601" '      # 用 $msec 替代（推荐），当开发了后端日志监控后
    'client_ip:"$remote_addr" '      #  '"xff":"$http_x_forwarded_for",'  有代理时用这个
    'trace_id:"$request_id" '
    'status:$status '
    'method:"$request_method",'
    'path:"$uri",'
    'query:"$query_string",'
    'req_total_cost:$request_time '
    'backend_cost:"$upstream_response_time" '
    'backend_addr:"$upstream_addr"';

    # 日志刷盘策略：64k 缓冲 + 1 分钟强制刷新
    access_log /var/log/nginx/access.log trace_log buffer=64k flush=1m;

    server {
        listen 80;
        server_name localhost;

        # ==================== 健康检查（噪音过滤） ====================
        location /health {
            access_log off;
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==================== 静态资源（噪音过滤） ====================
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            root /var/www/frontend;
            access_log off;
            # 4xx/5xx 异常状态码强制记录日志
            set $loggable 0;
            if ($status ~ ^(4|5)) {
                set $loggable 1;
            }
            if ($loggable = 1) {
                access_log /var/log/nginx/access.log trace_log;
            }
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ==================== 文件上传静态服务 ====================
        location /api/uploads/covers/ {
            alias /var/www/static/uploads/covers/;
            add_header Accept-Ranges bytes;
            add_header Access-Control-Allow-Origin *;
            expires 30d;
        }
        location /api/uploads/pdfs/ {
            alias /var/www/static/uploads/pdfs/;
            add_header Accept-Ranges bytes;
            add_header Access-Control-Allow-Origin *;
        }
        location /api/uploads/videos/ {
            alias /var/www/static/uploads/videos/;
            add_header Accept-Ranges bytes;
            add_header Access-Control-Allow-Origin *;
        }

        # ==================== 前端 SPA ====================
        location / {
            root /var/www/frontend;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # ==================== 后端 API（全链路追踪） ====================
        location /api/ {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 透传 Nginx 生成的请求 ID 到后端，保持全链路一致
            proxy_set_header X-Request-Id $request_id;
            # 允许前端通过 CORS 访问后端写入的 X-Request-Id 响应头
            add_header Access-Control-Expose-Headers X-Request-Id always;
            proxy_buffering off;
            proxy_cache off;
            proxy_http_version 1.1;
            proxy_read_timeout 300s;
        }
    }
}
