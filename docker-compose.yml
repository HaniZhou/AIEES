# Docker Compose V2

# 定义持久化数据卷
volumes:
  postgres_data:
  redis_data:

services:
  # ==============================
  # 1. 数据库服务 (Postgres)
  # ==============================
  db:
    image: postgres:18.3
    container_name: psql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - network1

  # ==============================
  # 2. 缓存/任务队列服务 (Redis)
  # ==============================
  redis:
    image: redis:8.4.2-alpine
    container_name: redis_server
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --maxmemory 500mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - network1

  # ==============================
  # 3. Web API 服务
  # ==============================
  api:
    build: .
    container_name: fastapi
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DOCKER_DB_USER}:${DOCKER_DB_PASSWORD}@${DOCKER_DB_HOST}:${DOCKER_DB_PORT}/${DOCKER_DB_NAME}
      - REDIS_URL=redis://:${DOCKER_REDIS_PASSWORD}@${DOCKER_REDIS_HOST}:${DOCKER_REDIS_PORT}/0
      - REDIS_HOST=${DOCKER_REDIS_HOST}
      - REDIS_PORT=${DOCKER_REDIS_PORT}
      - DB_HOST=${DOCKER_DB_HOST}
      - DB_PORT=${DOCKER_DB_PORT}
      - DB_NAME=${DOCKER_DB_NAME}
      - DB_USER=${DOCKER_DB_USER}
      - DB_PASSWORD=${DOCKER_DB_PASSWORD}
      - REDIS_PASSWORD=${DOCKER_REDIS_PASSWORD}
      - ADMIN_NAME=${ADMIN_NAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - BASE_URL=${BASE_URL}
      - API_KEY=${API_KEY}
    volumes:
      - ./static/uploads:/app/static/uploads
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - network1

  # ==============================
  # 4. ARQ Worker 服务
  # ==============================
  worker:
    build: .
    container_name: arq_worker
    command: ["arq", "app.core.arq_jobs.WorkerSettings"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DOCKER_DB_USER}:${DOCKER_DB_PASSWORD}@${DOCKER_DB_HOST}:${DOCKER_DB_PORT}/${DOCKER_DB_NAME}
      - REDIS_URL=redis://:${DOCKER_REDIS_PASSWORD}@${DOCKER_REDIS_HOST}:${DOCKER_REDIS_PORT}/0
      - REDIS_HOST=${DOCKER_REDIS_HOST}
      - REDIS_PORT=${DOCKER_REDIS_PORT}
      - DB_HOST=${DOCKER_DB_HOST}
      - DB_PORT=${DOCKER_DB_PORT}
      - DB_NAME=${DOCKER_DB_NAME}
      - DB_USER=${DOCKER_DB_USER}
      - DB_PASSWORD=${DOCKER_DB_PASSWORD}
      - REDIS_PASSWORD=${DOCKER_REDIS_PASSWORD}
      - ADMIN_NAME=${ADMIN_NAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - BASE_URL=${BASE_URL}
      - API_KEY=${API_KEY}
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - network1

  # ==============================
  # 5. Nginx 代理与静态文件服务
  # ==============================
  nginx:
    image: nginx:mainline-alpine3.23
    container_name: nginx
    ports:
      - "0.0.0.0:80:80"
    volumes:
      - ./frontend/dist:/var/www/frontend:ro
      - ./static/uploads:/var/www/static/uploads:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
      - /dev/null:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - network1


networks:
  network1:
    driver: bridge
