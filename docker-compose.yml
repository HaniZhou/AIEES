# Docker Compose V2

# 定义持久化数据卷
volumes:
  postgres_data:
    name: aiees_postgres_data
  redis_data:
    name: aiees_redis_data

networks:
  network_core:
    name: aiees_network_core
    driver: bridge

services:
  # ========(Postgres)===========
  db:
    image: postgres:18.3
    container_name: aiees_psql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: postgres -c config_file=/etc/postgresql/postgresql.conf # 显式指定配置文件路径，避免使用默认路径
    volumes:
      - postgres_data:/var/lib/postgresql  # 不要手动创建 /var/lib/postgresql/data 目录：postgres18新版镜像会自动创建子目录
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - network_core
    logging:
      driver: "local"
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"
    cpus: 10
    cpu_shares: 2048
    shm_size: 12gb  # Linux共享内存：shared_buffers需要其分配进程共享内存（默认64MB）
    mem_reservation: 16g
    mem_limit: 32g

  # ========(Redis)==============
  redis:
    image: redis:8.4.2-alpine
    container_name: aiees_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --maxmemory ${REDIS_MAXMEMORY} --maxmemory-policy allkeys-lru
    environment:
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - network_core
    logging:
      driver: "local"
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"
    cpus: 2
    cpu_shares: 1024
    mem_reservation: 4g
    mem_limit: 8g

  # =========Web API 服务============
  api:
    build:
      context: .
      dockerfile: fastapi/Dockerfile
    image: aiees/api:${VERSION:-latest}
    container_name: aiees_api
    env_file: .env
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/0
    volumes:
      - ./static/uploads:/app/static/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - network_core
    logging:
      driver: "local"
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"
    cpus: 10
    cpu_shares: 1024
    mem_reservation: 8g
    mem_limit: 12g

  # =======Taskiq Worker 服务============
  worker:
    build:
      context: .
      dockerfile: fastapi/Dockerfile
    image: aiees/worker:${VERSION:-latest}
    command: [ "taskiq", "worker", "app.task.broker:broker", "app.task","--workers", "${WORKER_CPUS:-2}" ]
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - network_core
    logging:
      driver: "local"
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"
    cpus: 4
    cpu_shares: 512
    mem_reservation: 16g
    mem_limit: 24g

  # =========Taskiq Scheduler 服务=======
  scheduler:
    build:
      context: .
      dockerfile: fastapi/Dockerfile
    image: aiees/scheduler:${VERSION:-latest}
    command: [ "taskiq", "scheduler", "app.task.scheduler:scheduler", "app.task" ]
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - network_core
    logging:
      driver: "local"
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"
    cpus: 1
    cpu_shares: 512
    mem_reservation: 256m
    mem_limit: 512m

  # ==========Nginx=============
  nginx:
    image: nginx:mainline-alpine3.23
    container_name: nginx
    ports:
      - "0.0.0.0:80:80"
    volumes:
      - ./frontend/dist:/var/www/frontend:ro
      - ./static/uploads:/var/www/static/uploads:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /dev/null:/etc/nginx/conf.d/default.conf
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - network_core
    logging:
      driver: "local"
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    cpus: 2
    cpu_shares: 1024
    mem_reservation: 256m
    mem_limit: 1g