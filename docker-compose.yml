# Docker Compose V2

# 定义持久化数据卷
volumes:
  postgres_data:
    name: aiees_postgres_data
  redis_data:
    name: aiees_redis_data

networks:
  network_core:
    name: aiees_network_core
    driver: bridge

services:
  # ==============================
  # 1. 数据库服务 (Postgres)
  # 数据库是性能核心，优先保证资源分配和稳定性（40%）
  db:
    image: postgres:18.3
    container_name: aiees_psql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql  # 不要手动创建 /var/lib/postgresql/data 目录：postgres18新版镜像会自动创建版本化子目录
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - network_core
    logging:
      driver: "local"
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"
    cpu_shares: 2048               # 高优先级
    mem_reservation: 4g            # 保证 4GB
    mem_limit: 16g                 # 安全上限 (应对内存泄漏)

  # ==============================
  # 2. 缓存/任务队列服务 (Redis)
  # Redis 作为缓存和任务队列，资源需求较高但次于数据库，优先保证内存分配和稳定性（20%）
  redis:
    image: redis:8.4.2-alpine
    container_name: aiees_redis  # 在env中配置redis最大内存 建议 maxmemory 设为 mem_limit 的 70%~80%
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --maxmemory 6gb --maxmemory-policy allkeys-lru
    environment:
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - network_core
    logging:
      driver: "local"
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"
    cpu_shares: 1536               # 次高优先级
    mem_reservation: 2g
    mem_limit: 8g

  # ==============================
  # 3. Web API 服务
  # Web API 需要保证响应速度和稳定性，优先保证 CPU 和内存分配（20%）
  api:
    build:
      context: .
      dockerfile: fastapi/Dockerfile
    image: aiees/api:${VERSION:-latest}
    container_name: aiees_api
    env_file: .env
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/0
    volumes:
      - ./static/uploads:/app/static/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - network_core
    logging:
      driver: "local"
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"
    cpu_shares: 1024   # 默认优先级
    mem_reservation: 2g
    mem_limit: 8g

  # ==============================
  # 4. Taskiq Worker 服务
  # Worker 需要保证任务处理的稳定性和效率，优先保证内存分配和适当的 CPU 资源（20%）
  worker:
    build:
      context: .
      dockerfile: fastapi/Dockerfile
    image: aiees/worker:${VERSION:-latest}
    command: ["taskiq", "worker", "app.task.broker:broker", "app.task"]
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - network_core
    logging:
      driver: "local"
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"
    # 修正后的资源配置
    cpu_shares: 512                # 较低优先级
    mem_reservation: 2g
    mem_limit: 16g                 # Worker 允许更大内存

  # ==============================
  # 4.1 Taskiq Scheduler 服务
  scheduler:
    build:
      context: .
      dockerfile: fastapi/Dockerfile
    image: aiees/scheduler:${VERSION:-latest}
    command: ["taskiq", "scheduler", "app.task.scheduler:scheduler", "app.task"]
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - network_core
    logging:
      driver: "local"
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"
    cpu_shares: 256
    mem_reservation: 512m
    mem_limit: 1g

  # ==============================
  # 5. Nginx 代理与静态文件服务
  # Nginx 主要负责静态文件服务和反向代理，资源需求较低，优先保证稳定性和适当的 CPU 资源（10%）
  nginx:
    image: nginx:mainline-alpine3.23
    container_name: nginx
    ports:
      - "0.0.0.0:80:80"
    volumes:
      - ./frontend/dist:/var/www/frontend:ro
      - ./static/uploads:/var/www/static/uploads:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /dev/null:/etc/nginx/conf.d/default.conf
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - network_core
    logging:
      driver: "local"
      options:
        max-size: "50m"
        max-file: "5"
        compress: "true"
    cpu_shares: 256                # 最低优先级
    mem_reservation: 256m
    mem_limit: 1g