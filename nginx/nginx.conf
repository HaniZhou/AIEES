events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    #  全局基础配置（补充） 
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;                    # 隐藏版本号

    client_max_body_size 500M;
    client_body_buffer_size 128k;

    #  gzip 压缩（补充） 
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml font/woff font/woff2;
    gzip_vary on;

    # mjs 类型补充

    types {
        application/javascript mjs;
    }

    # 日志格式 JSON
    # log_format trace_log escape=json '{'
    #     '"timestamp":"$time_iso8601",'
    #     '"client_ip":"$remote_addr",'
    #     #'"x_forwarded_for":"$http_x_forwarded_for",'
    #     '"trace_id":"$request_id",'
    #     '"latency":$request_time,'
    #     '"backend_cost":"$upstream_response_time",'
    #     # '"backend_addr":"$upstream_addr",'  多服务器
    #     '"status":$status,'
    #     '"method":"$request_method",'
    #     '"path":"$uri",'
    #     '"query":"$query_string"'
    # '}';
    log_format trace_log '$remote_addr - [rid]:$request_id  [latency]:$request_time [status]:$status $request_method $uri?$query_string';


    # error_log
    error_log /dev/stderr warn;
    access_log /dev/stdout trace_log;

    #  条件日志开关（map 方案） 
    # 静态资源默认不记录，仅 4xx/5xx 记录
    map $status $log_error_only {
        default      0;
        ~^[45]       1;      # 4xx 和 5xx 才记
    }

    server {
        listen 80;
        server_name localhost;

        # 健康检查（噪音过滤）
        location /health {
            access_log off;
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 静态资源（4xx/5xx 才记日志）
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            root /var/www/frontend;
            access_log /dev/stdout trace_log if=$log_error_only;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        #  文件上传静态服务
        location ^~ /api/uploads/covers/ {
            alias /var/www/static/uploads/covers/;
            access_log /dev/stdout trace_log if=$log_error_only;
            add_header Accept-Ranges bytes;
            add_header Access-Control-Allow-Origin *;
            expires 30d;
        }
        location ^~ /api/uploads/pdfs/ {
            alias /var/www/static/uploads/pdfs/;
            access_log /dev/stdout trace_log if=$log_error_only;
            add_header Accept-Ranges bytes;
            add_header Access-Control-Allow-Origin *;
            expires 30d;
        }
        location ^~ /api/uploads/videos/ {
            alias /var/www/static/uploads/videos/;
            access_log /dev/stdout trace_log if=$log_error_only;
            add_header Accept-Ranges bytes;
            add_header Access-Control-Allow-Origin *;
            # 视频不走浏览器长缓存，见问题④
            expires 7d;
        }


        #  前端 SPA 
        location / {
            root /var/www/frontend;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        #  后端 API（全链路追踪） 
        location /api/ {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
            add_header Access-Control-Expose-Headers X-Request-Id always;
            proxy_buffering off;
            proxy_cache off;
            proxy_http_version 1.1;
            proxy_read_timeout 300s;
        }
    }
}
