worker_processes auto;
#每个 worker 进程的最大打开文件数，默认 1024，容器环境可以 65536
worker_rlimit_nofile 65536;

events {
    use epoll;
    worker_connections 8192;  # 需要进一步确认
    multi_accept off;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # mjs 类型补充
    types {
        application/javascript mjs;
    }

    # ---------- 安全 ----------
    # 隐藏版本号
    server_tokens off;

    # ---------- 静态文件传输 ----------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # ---------- 客户端长连接超时（适配 AI 流式） ----------
    keepalive_timeout 60;

    # ---------- 客户端请求体限制 ----------
    # 客户端发送的请求体最大值，默认 1M
    client_max_body_size 500M;
    # 客户端请求体缓冲区大小，默认 8k
    client_body_buffer_size 128k;
    # 客户端请求头缓冲区大小，默认 1k
    client_header_buffer_size 2k;
    # 客户端请求头缓冲区数量，默认 4
    large_client_header_buffers 4 16k;

    # ---------- 全局 Gzip 压缩 ----------
    # 开启 gzip 压缩，对传输数据进行压缩
    gzip on;
    # 仅对特定类型的响应进行压缩
    gzip_static on;
    # 仅对大于 1k 的响应进行压缩
    gzip_min_length 1k;
    # 压缩级别，范围 1-9，数字越大压缩率越高，但 CPU 占用也越高
    gzip_comp_level 5;
    # 仅对特定类型的响应进行压缩
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml font/woff font/woff2;
    # 在响应头中添加 Vary: Accept-Encoding，告知缓存服务器（CDN/浏览器）需根据客户端是否支持 gzip 来分别存储缓存，避免缓存错乱
    gzip_vary on;

    # ---------- 文件元信息缓存 ----------
    # 启用文件缓存，设置最多缓存max个文件的元信息与淘汰规则。
    open_file_cache max=65536  inactive=60s;
    # 缓存有效期，到期后重新读取文件元信息更新缓存
    open_file_cache_valid 30s;
    # 最小访问次数，只有访问次数超过该值的文件才会被缓存
    open_file_cache_min_uses 2;
    # 记录文件缓存的错误信息，便于调试
    open_file_cache_errors on;

    # 日志格式 JSON
    # log_format trace_log escape=json '{'
    #     '"timestamp":"$time_iso8601",'
    #     '"client_ip":"$remote_addr",'
    #     #'"x_forwarded_for":"$http_x_forwarded_for",'
    #     '"trace_id":"$request_id",'
    #     '"latency":$request_time,'
    #     '"backend_cost":"$upstream_response_time",'
    #     # '"backend_addr":"$upstream_addr",'  多服务器
    #     '"status":$status,'
    #     '"method":"$request_method",'
    #     '"path":"$uri",'
    #     '"query":"$query_string"'
    # '}';
    log_format trace_log '$remote_addr - [rid]:$request_id  [latency]:$request_time [status]:$status $request_method $uri?$query_string';


    #--------- 日志输出 ----------
    error_log /dev/stderr warn;
    access_log /dev/stdout trace_log buffer=128k flush=4s;

    #--------- 仅记录 4xx/5xx 的访问日志 ----------
    map $status $log_error_only {
        default      0;      # 根据 $status 变量的值来设置 $log_error_only 变量的值
        ~^[45]       1;      # ^[45] 匹配 以4或5开头的字符串
    }

    #--------- 定义一个服务器组 ----------
    upstream api_backend {
    # 指定后端服务的地址。
    server api:8000;
    # 保持空闲的长连接（Keep-Alive） 在连接池中备用的数量
    keepalive 32;
    }

    server {
        # 监听地址 IP:Port
        listen 80;
        # 服务地址：本server只处理 server_name 的请求（前端发送的host值）
        server_name localhost;

        #--------- 健康检查 ----------
        location /health {
            access_log off;
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        #------- 后端 API ----------
        location /api/ {
            proxy_pass http://api_backend;

            # ---------- 链路追踪头 ----------
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
            add_header Access-Control-Expose-Headers X-Request-Id always;

            # ---------- 流式配置 ----------
            proxy_http_version 1.1;
            proxy_set_header Connection "";    # 上游长连接复用
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_max_temp_file_size 0;

            # ---------- 超时时间 ----------
            proxy_connect_timeout 5s;    # 内网连接请求最大等待时间
            proxy_send_timeout 300s;     # 向后端发送数据超时时间
            proxy_read_timeout 300s;     # 等待 API 产生下一个数据块的最长时间
            proxy_ignore_client_abort off;  # 客户端断开了，Nginx 就立刻切断与 API 的连接
        }

        #-------- 前端静态资源 ----------
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            root /var/www/frontend;
            access_log /dev/stdout trace_log if=$log_error_only;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        #-------- 后端静态资源 ----------
        location ^~ /api/uploads/covers/ {
            alias /var/www/static/uploads/covers/;
            access_log /dev/stdout trace_log if=$log_error_only;
            add_header Accept-Ranges bytes;
            add_header Access-Control-Allow-Origin *;  # TODO：必要时要加上跨域限制：本服务域名、前端域名
            expires 30d;
        }
        location ^~ /api/uploads/pdfs/ {
            alias /var/www/static/uploads/pdfs/;
            access_log /dev/stdout trace_log if=$log_error_only;
            add_header Accept-Ranges bytes;
            add_header Access-Control-Allow-Origin *;
            expires 30d;
        }
        location ^~ /api/uploads/videos/ {
            alias /var/www/static/uploads/videos/;
            access_log /dev/stdout trace_log if=$log_error_only;
            add_header Accept-Ranges bytes;
            add_header Access-Control-Allow-Origin *;
            expires 7d;
        }

        #-------- 前端 SPA ----------
        location = /index.html {
            root /var/www/frontend;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
        location / {
            root /var/www/frontend;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }
    }
}
